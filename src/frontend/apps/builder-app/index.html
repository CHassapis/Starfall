<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- the Starfall D20 icon set (public/icons, from the owner's home-screen kit; see public/branding/README.md) -->
    <link rel="icon" href="/icons/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <!-- installable as an app (iPhone/iPad: Share > Add to Home Screen; Android/desktop Chrome: Install app). No
         service worker: nothing is cached for offline use. use-credentials: the manifest is fetched with the site
         password where the site has one -->
    <link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials" />
    <meta name="application-name" content="Starfall" />
    <meta name="apple-mobile-web-app-title" content="Starfall" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" content="#f4f0e8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Starfall</title>
    <!-- the saved theme before the first paint (mirrors normalizeTheme in src/lib/themes.ts), so a Midnight or
         Slate page never flashes Porcelain while the app loads -->
    <script>
      (function () {
        var t = null;
        try { t = localStorage.getItem("starlights-ui-theme"); } catch (e) { /* storage unavailable */ }
        if (t === "dark") t = "midnight";
        if (t === "light") t = "porcelain";
        if (t === "system") t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "midnight" : "porcelain";
        if (t !== "midnight" && t !== "slate") t = "porcelain";
        var root = document.documentElement, dark = t !== "porcelain";
        root.dataset.theme = t;
        root.classList.add(dark ? "dark" : "light");
        root.style.colorScheme = dark ? "dark" : "light";
        // the browser bar / installed app's title bar in the theme's background (lib/themes.ts THEMES[].colors[0])
        var bar = document.querySelector('meta[name="theme-color"]');
        if (bar) bar.setAttribute("content", t === "midnight" ? "#0c1628" : t === "slate" ? "#2d3e51" : "#f4f0e8");
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Overpass:ital,wght@0,100..900;1,100..900&family=Rubik:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">
  </head>
  <body >
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
