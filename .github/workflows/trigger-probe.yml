name: Trigger probe (temporary)

on:
  workflow_dispatch:
  push:
    branches:
      - dev
      - ci/trigger-probe
  pull_request:
    branches:
      - main
      - dev
      - aurora-server

permissions:
  id-token: write
  contents: read

env:
  DOTNET_VERSION: "10.0.x"

jobs:
  probe:
    name: Probe
    runs-on: ubuntu-latest
    steps:
      - run: echo "push event reached Actions for ${{ github.ref }} ${{ env.DOTNET_VERSION }}"
